name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Repo-level minimal permissions — jobs grant only what they need
permissions:
  contents: read

jobs:
  # ── 1. Secret / credential scan ─────────────────────────────────────────
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0    # full history — gitleaks scans all commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Python dependency CVE scan + SAST ────────────────────────────────
  python-security:
    name: Python security (trivy + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      - name: Scan Python dependencies with Trivy
        run: |
          trivy fs addon/requirements.txt \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: SAST — bandit (medium severity+, medium confidence+, skip assert-noise)
        run: bandit -r addon/src/ -ll -ii --skip B101

  # ── 3. Frontend dependency audit ────────────────────────────────────────
  frontend-security:
    name: Frontend security (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: addon/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── 4. Lint + type-check ────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: addon/frontend/package-lock.json
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python
        run: ruff check addon/src/ tests/addon/
      - name: Install frontend deps
        run: cd addon/frontend && npm ci
      - name: TypeScript type-check
        run: cd addon/frontend && npx tsc --noEmit

  # ── 5. Tests ────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: addon/frontend/package-lock.json
      - name: Install Python deps
        run: pip install -r addon/requirements.txt -r requirements-test.txt
      - name: Run Python tests
        run: pytest --tb=short
      - name: Install frontend deps
        run: cd addon/frontend && npm ci
      - name: Symlink node_modules for test resolution
        run: ln -sfn ../../addon/frontend/node_modules tests/frontend/node_modules
      - name: Run frontend tests
        run: cd addon/frontend && npm test -- --run

  # ── 6. Docker build + image scan ────────────────────────────────────────
  docker:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [test, python-security, frontend-security]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ./addon
          platforms: linux/amd64
          push: false
          load: true
          tags: feederwatch-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan image with Trivy
        run: |
          trivy image feederwatch-ai:ci \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1
